# Base / development stack. Run from the repo root:
#   docker compose -f infra/compose/docker-compose.yml up -d --build
#
# Environment is read from the repo-root .env (see .env.example).

name: control-plane

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-control}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-control}
      POSTGRES_DB: ${POSTGRES_DB:-control_plane}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-control} -d ${POSTGRES_DB:-control_plane}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  backend:
    build:
      context: ../../apps/backend
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-control}:${POSTGRES_PASSWORD:-control}@db:5432/${POSTGRES_DB:-control_plane}
      REDIS_URL: redis://redis:6379/0
      TRAEFIK_DYNAMIC_DIR: /data/traefik/dynamic
    volumes:
      - traefik_dynamic:/data/traefik/dynamic
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks: [internal, edge]
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.cp-api.rule=PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/healthz`)
      - traefik.http.routers.cp-api.entrypoints=websecure
      - traefik.http.routers.cp-api.tls=true
      - traefik.http.services.cp-api.loadbalancer.server.port=8000

  worker:
    build:
      context: ../../apps/backend
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-control}:${POSTGRES_PASSWORD:-control}@db:5432/${POSTGRES_DB:-control_plane}
      REDIS_URL: redis://redis:6379/0
      TRAEFIK_DYNAMIC_DIR: /data/traefik/dynamic
      RUN_MIGRATIONS: "0"
    command: ["celery", "-A", "app.tasks.celery_app.celery", "worker", "--loglevel=INFO"]
    volumes:
      - traefik_dynamic:/data/traefik/dynamic
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  beat:
    build:
      context: ../../apps/backend
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-control}:${POSTGRES_PASSWORD:-control}@db:5432/${POSTGRES_DB:-control_plane}
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "0"
    command: ["celery", "-A", "app.tasks.celery_app.celery", "beat", "--loglevel=INFO"]
    depends_on:
      - redis
    networks: [internal]

  frontend:
    build:
      context: ../../apps/frontend
      args:
        # Baked into the client bundle at build time. Empty means same-origin
        # (the browser calls /api on the same host Traefik serves the UI from).
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks: [internal, edge]
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.cp-ui.rule=PathPrefix(`/`)
      - traefik.http.routers.cp-ui.entrypoints=websecure
      - traefik.http.routers.cp-ui.tls=true
      - traefik.http.routers.cp-ui.priority=1
      - traefik.http.services.cp-ui.loadbalancer.server.port=3000

  wg-easy:
    # WireGuard hub + admin panel. Source of truth for peers/clients; the
    # backend talks to its API and the UI links operators to its panel.
    # Pinned to 13 on purpose: from v14 the plaintext PASSWORD env no longer
    # enables panel auth (it silently requires PASSWORD_HASH instead), which
    # leaves the admin panel wide open. The backend authenticates to this same
    # panel with PASSWORD via POST /api/session, so plaintext auth is required.
    image: ghcr.io/wg-easy/wg-easy:13
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    environment:
      # Public host/IP of the VPS that WireGuard clients dial into.
      WG_HOST: ${WG_HOST:-localhost}
      # Panel password; the backend reuses it to authenticate to the API.
      PASSWORD: ${WGEASY_PASSWORD:-}
      PORT: "51821"
      WG_PORT: "51820"
    volumes:
      - wg_easy_data:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821"  # dev only: panel on host; prod routes it via Traefik
    networks: [internal, edge]

  traefik:
    # v3.6+ auto-negotiates the Docker API version with the daemon. Earlier v3.x
    # hardcoded API v1.24, which modern daemons reject (min supported >= 1.40).
    image: traefik:v3.6
    restart: unless-stopped
    # Static config is supplied as CLI flags (not a mounted file) so Compose
    # interpolates ${ACME_EMAIL} from .env. Traefik does NOT expand ${...} inside
    # a static config FILE: a file-based `email: "${ACME_EMAIL}"` is sent to
    # Let's Encrypt verbatim, fails ACME account registration, and then NO
    # certificates are issued for any domain. Dynamic config still comes from the
    # file provider (base.yml + the control-plane generated control-plane.yml).
    command:
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.address=:443
      - --entryPoints.traefik.address=:8080
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=edge
      - --certificatesResolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}
      - --certificatesResolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesResolvers.letsencrypt.acme.httpChallenge.entryPoint=web
      - --log.level=INFO
      - --log.format=json
      - --accessLog.format=json
      - --ping.entryPoint=traefik
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ../traefik/dynamic/base.yml:/etc/traefik/dynamic/base.yml:ro
      - traefik_dynamic:/etc/traefik/dynamic
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge]

volumes:
  pgdata:
  redisdata:
  traefik_dynamic:
  letsencrypt:
  wg_easy_data:

networks:
  internal:
    driver: bridge
  edge:
    name: edge
    driver: bridge
