# Production overrides. Apply on top of the base file:
#   docker compose \
#     -f infra/compose/docker-compose.yml \
#     -f infra/compose/docker-compose.prod.yml \
#     up -d --build
#
# Differences from the base stack:
#   - no host port bindings for backend/frontend (only Traefik is public)
#   - read-only docker socket, tighter restart policy
#   - resource limits and log rotation
#   - migrations run only on the backend container

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    logging: *default-logging

  backend:
    ports: !reset []
    logging: *default-logging
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
    # Bind the admin API to its public hostname and request a real Let's Encrypt
    # certificate. Without a Host() matcher ACME has no domain to issue for, and
    # without certresolver Traefik serves its self-signed default cert.
    labels:
      - "traefik.http.routers.cp-api.rule=Host(`${ADMIN_DOMAIN:?ADMIN_DOMAIN must be set for the production stack (e.g. admin.example.com)}`) && (PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/healthz`))"
      - "traefik.http.routers.cp-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    logging: *default-logging

  beat:
    logging: *default-logging

  frontend:
    ports: !reset []
    logging: *default-logging
    labels:
      - "traefik.http.routers.cp-ui.rule=Host(`${ADMIN_DOMAIN:?ADMIN_DOMAIN must be set for the production stack (e.g. admin.example.com)}`)"
      - "traefik.http.routers.cp-ui.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"

  wg-easy:
    logging: *default-logging
    # Only the WireGuard UDP port is public; the panel is served through Traefik
    # on a subdomain of ADMIN_DOMAIN (e.g. wg.admin.example.com).
    ports: !override
      - "51820:51820/udp"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge"
      - "traefik.http.routers.wg-easy.rule=Host(`wg.${ADMIN_DOMAIN:?ADMIN_DOMAIN must be set for the production stack (e.g. admin.example.com)}`)"
      - "traefik.http.routers.wg-easy.entrypoints=websecure"
      - "traefik.http.routers.wg-easy.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.wg-easy.loadbalancer.server.port=51821"

  traefik:
    logging: *default-logging
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports: !override
      - "80:80"
      - "443:443"
