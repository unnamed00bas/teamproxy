# Traefik static configuration.
# Dynamic routing is provided by:
#   - the file provider (control-plane writes /etc/traefik/dynamic/control-plane.yml)
#   - the docker provider (for infrastructure services with labels)
# Both providers run simultaneously.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  traefik:
    address: ":8080"

api:
  dashboard: true
  # Dashboard is exposed on the traefik entrypoint; restrict it at the edge in prod.
  insecure: true

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
  docker:
    exposedByDefault: false
    network: edge

certificatesResolvers:
  letsencrypt:
    acme:
      email: "${ACME_EMAIL}"
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO
  format: json

accessLog:
  format: json

ping:
  entryPoint: traefik
