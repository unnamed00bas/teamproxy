name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Ship to server over SSH (build & run there)
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/control-plane' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Render production .env from secrets
        run: |
          cat > .env <<EOF
          ENVIRONMENT=production
          DEBUG=false
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ACCESS_TOKEN_EXPIRE_MINUTES=720
          FIRST_SUPERADMIN_EMAIL=${{ secrets.FIRST_SUPERADMIN_EMAIL }}
          FIRST_SUPERADMIN_PASSWORD=${{ secrets.FIRST_SUPERADMIN_PASSWORD }}
          POSTGRES_USER=control
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=control_plane
          DATABASE_URL=postgresql+asyncpg://control:${{ secrets.POSTGRES_PASSWORD }}@db:5432/control_plane
          REDIS_URL=redis://redis:6379/0
          ACME_EMAIL=${{ secrets.ACME_EMAIL }}
          ADMIN_DOMAIN=${{ vars.ADMIN_DOMAIN }}
          PUBLIC_API_BASE_URL=${{ secrets.PUBLIC_API_BASE_URL }}
          CORS_ORIGINS=${{ secrets.PUBLIC_API_BASE_URL }}
          WG_HOST=${{ vars.WG_HOST || secrets.SSH_HOST }}
          WGEASY_PASSWORD=${{ secrets.WGEASY_PASSWORD }}
          WGEASY_API_URL=http://wg-easy:51821
          WGEASY_PUBLIC_URL=https://wg.${{ vars.ADMIN_DOMAIN }}
          EOF

      - name: Sync repository to server
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p $SSH_PORT"
          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"
          # Copy the working tree (including the rendered .env) to the server.
          # --delete keeps the server in sync with the repo; runtime data
          # (backups, .git, build caches) is excluded and preserved.
          rsync -az --delete \
            -e "$SSH" \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'backups' \
            --exclude '*.db' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Build, migrate, run and smoke-test on server
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && chmod +x infra/scripts/*.sh && ./infra/scripts/deploy.sh"

      - name: Report
        if: success()
        run: echo "Deployed ${GITHUB_SHA} to ${SSH_HOST}:${DEPLOY_PATH}"
